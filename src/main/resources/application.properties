spring.application.name=rental-listings

spring.datasource.url=jdbc:mysql://localhost:3306/rental_listings?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=rental
spring.datasource.password=rentalpass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# Base64-encoded HMAC key. Override with the JWT_SECRET environment variable outside development.
app.jwt.secret=${JWT_SECRET:Ksjw7C9a1gkVy4EzIh1OKER5bLBsWvWH7YT6tMvtVZU=}
# How long an issued token stays valid
app.jwt.expiration=24h