<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listing form – Rental Listings</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="logo">Rental Listings</a>
        <nav>
            <a href="index.html">Listings</a>
            <a href="listing-form.html">Add listing</a>
            <a href="register.html">Register</a>
        </nav>
    </div>
</header>

<main class="container narrow">
    <h1 id="form-title">Add a listing</h1>
    <p id="message" class="message" hidden></p>

    <form id="listing-form" class="panel">
        <div class="form-field" id="owner-field">
            <label for="owner">Landlord</label>
            <select id="owner" name="owner" required></select>
        </div>

        <div class="form-row">
            <div class="form-field">
                <label for="city">City</label>
                <input type="text" id="city" name="city" required>
            </div>
            <div class="form-field">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-field">
                <label for="rooms">Rooms</label>
                <input type="number" id="rooms" name="rooms" min="1" required>
            </div>
            <div class="form-field">
                <label for="area">Area (m²)</label>
                <input type="number" id="area" name="area" min="1" step="0.1" required>
            </div>
            <div class="form-field">
                <label for="price">Price (PLN / month)</label>
                <input type="number" id="price" name="price" min="1" required>
            </div>
        </div>

        <div class="form-field checkbox-field">
            <input type="checkbox" id="parking" name="parking">
            <label for="parking">Parking space available</label>
        </div>

        <div class="form-field">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="5" maxlength="2000"></textarea>
        </div>

        <button type="submit" class="button">Save listing</button>
    </form>

    <section id="photos-section" class="panel" hidden>
        <h2>Photos</h2>
        <div id="photo-list" class="photo-list"></div>
        <form id="photo-form" class="photo-form">
            <input type="url" id="photo-url" placeholder="https://example.com/photo.jpg" required>
            <button type="submit" class="button">Add photo</button>
        </form>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/listing-form.js"></script>
</body>
</html>
