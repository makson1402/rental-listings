services:
  mysql:
    image: mysql:8.0
    container_name: rental-listings-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: rental_listings
      MYSQL_USER: rental
      MYSQL_PASSWORD: rentalpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: